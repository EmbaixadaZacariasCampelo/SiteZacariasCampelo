name: Deploy Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r CursoXadrez/requirements.txt

      - name: Build MkDocs
        run: |
          cd CursoXadrez
          mkdocs build

      - name: Prepare public folder
        run: |
          mkdir public
          
          # Copiar página principal
          cp index.html public/
          
          # Copiar pastas do site
          cp -r css public/ 2>/dev/null || true
          cp -r js public/ 2>/dev/null || true
          cp -r image public/ 2>/dev/null || true
          
          # Criar pasta documentacao ANTES de copiar
          mkdir -p public/documentacao
          
          # Copiar documentação MkDocs
          cp -r CursoXadrez/site/* public/documentacao/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
